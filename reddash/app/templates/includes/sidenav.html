<!-- Slim horizontal topbar: brand + nav + search/user/settings merged into one strip. -->
<header class="cx-topbar" id="cx-topbar">

  <a class="cx-brand" href="/">
    <img src="{{ variables["bot"]["avatar"] }}" alt="{{ variables["bot"]["name"] }}" />
    <span>{{ variables["bot"]["name"] }}</span>
  </a>

  <ul class="cx-nav">
    {% for item in variables["sidenav"] %}
      <li>
        <a class="{{ "active" if item["active"] else "" }}"
           href="{{ item["url"] }}"
           {{ ' target="blank"' if item["is_http"] }}
           title="{{ item["name"] }}">
          <i class="{{ item["icon"] }}"></i>
          <span>{{ item["name"] }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>

  <div class="cx-spacer"></div>

  <div class="cx-right">

    <div class="cx-search">
      <i class="fa fa-search" aria-hidden="true"></i>
      <input type="search" placeholder="{{ _("Search...") }}" aria-label="{{ _("Search...") }}" />
    </div>

    {% if current_user.is_authenticated %}
      <div class="dropdown">
        <a class="cx-user" href="javascript:void(0);" role="button" id="user_dropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <img src="{{ current_user.display_avatar }}" alt="{{ current_user.display_name }}" />
          <span class="d-none d-sm-inline">{{ current_user.display_name }}</span>
          <i class="ni ni-bold-down" style="font-size: 0.6rem;"></i>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user_dropdown">
          <li><a href="{{ url_for("login_blueprint.logout") }}" class="dropdown-item text-danger"><i class="ni ni-user-run" style="width: 1.3em; vertical-align: -2px;"></i> {{ _("Logout") }}</a></li>
        </ul>
      </div>
    {% else %}
      <a href="{{ full_login_url }}" class="btn btn-sm bg-gradient-{{ variables["meta"]["color"] }} mb-0">
        <i class="ni ni-key-25 me-sm-1" style="vertical-align: -1.5px;"></i>
        <span class="d-sm-inline d-none">{{ _("Login") }}</span>
      </a>
    {% endif %}

  </div>
</header>
