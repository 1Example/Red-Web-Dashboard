<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" type="image/png" href="{{ variables["meta"]["icon"] }}" />

    <!-- This dashboard already ships a dark theme. Tell the browser (and
         extensions like Dark Reader) not to re-tint it, which otherwise
         repaints every card grey with !important rules. -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />

    <title>
      {{ variables["meta"]["title"] }} - {% block title %}{% endblock %}
    </title>
    <!-- Meta tags -->
    <meta property="og:site_name" content="{{ variables["meta"]["title"] }}" />
    <meta property="og:title" content="{{ variables["meta"]["title"] }} - {{ self.title() }}" />
    <meta name="description" property="og:description" content="{{ variables["meta"]["website_description"] }}" />
    <meta property="og:image" content="{{ variables["meta"]["icon"] }}" />
    <meta name="theme-color" content="{{ variables["meta"]["color"] }}" />
    <meta name="language" content="fr" />
    <script type="application/ld+json">
      {
        "@context" : "https://schema.org",
        "@type" : "WebSite",
        "name" : "{{ variables['meta']['title'] }}",
        "url" : "{{ url_for('base_blueprint.index') }}"
      }
    </script>
    {% if False %}
      <meta name="robots" content="noindex, nofollow" />
    {% endif %}

    <!-- Fonts and icons -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
    <!-- Nucleo Icons -->
    <link href="{{ config.ASSETS_ROOT }}/css/nucleo-icons.css" rel="stylesheet" />
    <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />
    <!-- Font Awesome Icons -->
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css" rel="stylesheet" />
    <link href="{{ config.ASSETS_ROOT }}/css/nucleo-svg.css" rel="stylesheet" />
    <!-- CSS Files -->
    <link id="pagestyle" href="{{ config.ASSETS_ROOT }}/css/argon-dashboard.css?v={{ variables['stats']['uptime'] }}" rel="stylesheet" />
    <link id="background_theme" href="{{ config.ASSETS_ROOT }}/css/themes/background_theme_{{ variables["meta"]["background_theme"] }}.css" rel="stylesheet" />
    <link id="sidenav_theme" href="{{ config.ASSETS_ROOT }}/css/themes/sidenav_theme_{{ variables["meta"]["sidenav_theme"] }}.css" rel="stylesheet" />
    <link id="cubix_stars" href="{{ config.ASSETS_ROOT }}/css/cubix-stars.css?v={{ variables['stats']['uptime'] }}" rel="stylesheet" />
    <link id="cubix_theme" href="{{ config.ASSETS_ROOT }}/css/cubix-theme.css?v={{ variables['stats']['uptime'] }}" rel="stylesheet" />
  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet" />
    <style>
      body #toast-container > div {
        opacity: 1;
        margin-top: 6px;
        width: 500px !important;
      }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css" rel="stylesheet" />
    <style>
      .EasyMDEContainer {
        .editor-toolbar i.separator {
          position: relative; /* Fix separator icons display. */
          height: auto;
        }
        .editor-toolbar {
          &.fullscreen {
            z-index: 9999;
          }
        }
        .CodeMirror {
          .CodeMirror-code .cm-comment:only-child {
            display: block;
          }
          &.CodeMirror-fullscreen {
            z-index: 9999;
          }
        }
      }
    </style>
    <link href="https://unpkg.com/dropzone@6.0.0-beta.1/dist/dropzone.css" rel="stylesheet" />
    <style>
      .dropzone {
        border: 1px solid #d2d6da;
      }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" rel="stylesheet" />
    <style>
      .choices:not([data-type*=select-one]) .choices__item:not(.choices__item--choice) {
        background-color: #2dce89 !important;
      }
    </style>
    <link href="https://pagination.js.org/dist/2.6.0/pagination.css" rel="stylesheet" />

    <!-- Specific CSS goes HERE -->
    {% block stylesheets %}{% endblock %}
  </head>

  <body class="g-sidenav-show bg-gray-100">
    <div class="cx-stars" aria-hidden="true">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
      <div id="stars4"></div>
    </div>

    {% include "includes/navigation.html" %}

    {% include "includes/sidenav.html" %}

    {% block content %}
    {% endblock %}


    <!-- Control Center for Soft Dashboard: parallax effects, scripts for the example pages etc -->
    {% include "includes/scripts.html" %}
    <script src="{{ config.ASSETS_ROOT }}/js/argon-dashboard.js?v={{ variables['stats']['uptime'] }}"></script>
    <script>
    // The server switcher runs its own toggle rather than Bootstrap's dropdown:
    // the theme's `.dropdown-menu` rules promote the menu to a GPU layer that
    // rendered see-through, and there is nothing to gain from inheriting them.
    (function () {
      function close(gs) {
        gs.classList.remove("open");
        var t = gs.querySelector(".cx-guild-switch-toggle");
        if (t) { t.setAttribute("aria-expanded", "false"); }
      }
      document.addEventListener("click", function (event) {
        var toggle = event.target.closest && event.target.closest(".cx-guild-switch-toggle");
        if (toggle) {
          event.preventDefault();
          var gs = toggle.closest(".cx-gs");
          var wasOpen = gs.classList.contains("open");
          document.querySelectorAll(".cx-gs.open").forEach(close);
          if (!wasOpen) {
            gs.classList.add("open");
            toggle.setAttribute("aria-expanded", "true");
            var search = gs.querySelector(".cx-gs-search");
            if (search) { search.focus(); }
          }
          return;
        }
        // A click inside the menu is either a link (let it through) or the
        // search box (keep the menu open); anything else closes it.
        if (event.target.closest && event.target.closest(".cx-gs-menu")) {
          if (event.target.classList.contains("cx-gs-search")) { return; }
          if (!event.target.closest(".cx-gs-item")) { return; }
          return;
        }
        document.querySelectorAll(".cx-gs.open").forEach(close);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          document.querySelectorAll(".cx-gs.open").forEach(close);
        }
      });
      document.addEventListener("input", function (event) {
        var box = event.target;
        if (!box.classList || !box.classList.contains("cx-gs-search")) { return; }
        var menu = box.closest(".cx-gs-menu");
        if (!menu) { return; }
        var query = box.value.trim().toLowerCase();
        menu.querySelectorAll(".cx-gs-item[data-name]").forEach(function (item) {
          item.style.display =
            (item.getAttribute("data-name") || "").indexOf(query) > -1 ? "" : "none";
        });
      });
    })();
    </script>

    <!-- Specific JS goes HERE -->
    {% block javascripts %}{% endblock %}
  </body>
</html>
