{% extends "layouts/base.html" %}

{% block title %}
  {{ _("Modules") }}
{% endblock %}

{% block stylesheets %}{% endblock %}

{% block content %}
  <main class="main-content position-relative border-radius-lg">
    <div class="container-fluid py-4">
      <div class="col-12">
        {% include "pages/third_parties/third_parties_list.html" %}
      </div>
    </div>
  </main>
{% endblock %}

{% block javascripts %}
  <script>
    window.onload = function() {
      resize_event = new Event("resize");
      window.dispatchEvent(resize_event);
    }
  </script>
  <script>
    // Deep-link support: /third-parties/<name> scrolls to and highlights that module's card.
    {% if tab_name %}
      document.addEventListener("DOMContentLoaded", function() {
        var input = document.getElementById("moduleSearchInput");
        if (input) {
          input.value = "{{ tab_name }}";
          filterModuleCards();
        }
      });
    {% endif %}
  </script>
{% endblock %}
